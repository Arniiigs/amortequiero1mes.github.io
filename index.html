<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Protegido</title>
    <style>
        body {
            font-family: 'Comic Sans MS', cursive, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #ffcccc, #ff6699); /* Degradado de rosa claro a rosa más oscuro */
        }

        #login-container, #content-container {
            display: none;
            text-align: center;
            border: 2px solid #ff6f91;
            padding: 80px 30px; /* Padding ajustado */
            background-color: rgba(255, 255, 255, 0.9);
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            border-radius: 20px;
            max-width: 800px; /* Ancho máximo del contenedor */
            width: 100%; /* Ancho completo en pantallas pequeñas */
            margin: 0 auto; /* Centra el contenedor horizontalmente */
        }

        #login-container.active, #content-container.active {
            display: block;
        }

        h2 {
            color: #ff6f91;
            font-size: 24px;
            margin: 0 0 20px 0;
        }

        input[type="password"] {
            padding: 15px;
            width: 90%;
            margin-bottom: 20px;
            border: 2px solid #ff6f91;
            border-radius: 10px;
            font-size: 18px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        button {
            padding: 12px 24px;
            font-size: 16px;
            color: #fff;
            background-color: #ff6f91;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        button:hover {
            background-color: #ff3b6f;
        }

        #content-container {
            text-align: center;
            margin-top: 800px; /* Aumentado el margen superior para mover el contenido aún más hacia abajo */
        }

        .media-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px; /* Espacio entre los elementos */
            margin-top: 20px;
            flex-wrap: wrap; /* Permite que los elementos se ajusten en pantallas pequeñas */
        }

        .media-container img, .media-container video {
            max-width: 30%; /* Asegura que las imágenes y el video no ocupen más del 30% del ancho del contenedor */
            height: auto;
            border-radius: 10px;
        }

        video {
            max-width: 40%; /* Ancho máximo del video */
        }

        #content-container h1 {
            color: #ff6f91;
            margin: 40px 0 20px 0; /* Ajustado el margen superior */
        }

        #content-container p {
            margin-bottom: 20px;
        }

        audio {
            display: none; /* Oculta el reproductor de audio */
        }
    </style>
</head>
<body>

<div id="login-container" class="active">
    <h2> Pon tu nombre amor:) ❤️</h2>
    <input type="password" id="password" placeholder="Tu nombre">
    <br>
    <button onclick="checkPassword()">Entrar</button>
</div>

<div id="content-container">
    <h1>Molt bé amor, feliç un mes t'estimooo 💖</h1>
    <p>DAME A MI JACK DANIELS </p>
    
    <div class="media-container">
        <img src="https://i.ibb.co/Kh9M87c/Whats-App-Image-2024-08-20-at-20-34-20-1.jpg" alt="Foto 1">
        <video id="video" controls loop>
            <source src="WhatsApp Video 2024-08-20 at 20.31.28.mp4" type="video/mp4">
        </video>
        <img src="https://i.ibb.co/0C0W5Tf/Whats-App-Image-2024-08-20-at-20-34-20-2.jpg" alt="Foto 2">
    </div>
</div>

<audio id="music" src="ytmp3free.cc_cosas-que-no-te-dije-saiko-letra-saiko-youtubemp3free.org.mp3" preload="auto" autoplay></audio>

<script>
    function checkPassword() {
        const inputPassword = document.getElementById('password').value;
        const correctPassword = 'Amor';  // Cambia esta contraseña por la que desees

        if (inputPassword === correctPassword) {
            document.getElementById('login-container').classList.remove('active');
            document.getElementById('content-container').classList.add('active');
            document.getElementById('music').play(); // Reproduce la canción
            document.getElementById('video').play(); // Reproduce el video automáticamente
        } else {
            alert('Contraseña incorrecta, pista es tu verdadero nombre jejjeje :) (la primera en mayúscula amor)');
        }
    }

    // Asegúrate de que el audio se reproduzca si está listo
    document.getElementById('music').addEventListener('canplaythrough', function() {
        if (document.getElementById('content-container').classList.contains('active')) {
            this.play();
        }
    });
</script>

</body>
</html>
